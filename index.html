<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipping Card UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="Flipping-Card">
    <div class="container">
        <div class="card front-Face">
            <div class="header">
                <span class="logo">
                    <img src="OIP-removebg-preview.png" alt="">
                    <h5>Master Card </h5>
                </span>
                <span >
                    <img src="Screenshot_2026-09-30_174118-removebg-preview.png" alt="" class="chip">
                </span>
            </div>

            <div class="card-details">
                <div class="name-number">
                    <h6>Card Number</h6>
                    <h5 class="number">1234 5678 9012 3456</h5>
                    <h5 class="name">John Doe</h5>
                </div>
                <div class="valid">
                    <h6>Valid Thru</h6>
                    <h5 >12/24</h5>
            </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
